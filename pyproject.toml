[project]
name = "quant-platform"
version = "0.1.0"
description = "TramitaGO Quant Platform"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy",
    "pandas",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.16.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
required-version = "==0.16.1"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.pytest.ini_options]
pythonpath = ["src"]